<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Gamer - Flask</title>
    <!-- Busca directamente style.css dentro de tu carpeta Static configurada -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <div class="msg bot">¡Hola! Pregúntame sobre Zelda, Mario o pide una recomendación.</div>
        </div>
        <div class="input-area">
            <input type="text" id="mensaje" placeholder="Escribe un mensaje..." onkeypress="tecla(event)">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        function agregarMensaje(texto, tipo) {
            const box = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = "msg " + tipo;
            div.innerText = texto;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function enviarMensaje() {
            const input = document.getElementById("mensaje");
            const texto = input.value;
            if (!texto.trim()) return;

            agregarMensaje(texto, "user");
            input.value = "";

            fetch("/enviar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mensaje: texto })
            })
            .then(res => res.json())
            .then(data => {
                agregarMensaje(data.respuesta, "bot");
            });
        }

        function tecla(e) {
            if (e.key === "Enter") enviarMensaje();
        }
    </script>
</body>
</html>
